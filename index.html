<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenvyra AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #0b0d10;
      color: #f5f7fa;
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 245px;
      border-right: 1px solid #22262d;
      background: #101216;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      padding: 8px 12px 28px;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #8b7cff;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      border: 1px solid #30343b;
      background: #191c21;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .new-chat:hover {
      background: #22262d;
    }

    .section-title {
      color: #777e89;
      font-size: 11px;
      text-transform: uppercase;
      padding: 0 12px 8px;
      letter-spacing: 1px;
    }

    .nav-item {
      padding: 11px 12px;
      border-radius: 9px;
      color: #aeb4bd;
      margin-bottom: 3px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #1c2026;
      color: white;
    }

    .bottom {
      margin-top: auto;
      border-top: 1px solid #22262d;
      padding-top: 15px;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid #22262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .model {
      font-size: 14px;
      color: #cbd0d8;
    }

    .status {
      font-size: 12px;
      color: #858c96;
    }

    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 50px 20px 30px;
    }

    .content {
      width: 100%;
      max-width: 850px;
    }

    .hero {
      text-align: center;
      margin: 35px 0 45px;
    }

    .hero h1 {
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #858c96;
      font-size: 15px;
    }

    /* Tools */
    .tools {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tool {
      border: 1px solid #292e36;
      background: #15181d;
      color: #aeb4bd;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .tool:hover,
    .tool.active {
      background: #232731;
      color: white;
      border-color: #454b56;
    }

    /* Composer */
    .composer {
      border: 1px solid #343941;
      background: #15181d;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      line-height: 1.6;
      padding: 8px;
    }

    textarea::placeholder {
      color: #686f79;
    }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }

    .left-actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      border: 1px solid #30353d;
      background: #1b1e23;
      color: #aeb4bd;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .generate {
      border: none;
      background: white;
      color: #0b0d10;
      border-radius: 9px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate:hover {
      opacity: .88;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 35px;
    }

    .card {
      background: #12151a;
      border: 1px solid #242830;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3a404a;
    }

    .card-icon {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .card p {
      color: #747b85;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #555b65;
      font-size: 11px;
      padding: 15px;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 15px;
      }

      .workspace {
        padding: 20px 14px;
      }

      .hero {
        margin: 35px 0 30px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .composer-bottom {
        align-items: flex-end;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <aside class="sidebar">
      <div class="logo">Zenvyra<span> AI</span></div>

      <button class="new-chat" onclick="newChat()">＋ New chat</button>

      <div class="section-title">Workspace</div>

      <div class="nav-item active" onclick="selectMode('Chat')">💬 Chat</div>
      <div class="nav-item" onclick="selectMode('Image')">◈ Images
